<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WithUs Vault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-border: #1f1f23;
      --input-bg: #121215;
      --input-border: #1f1f23;
      --input-focus: #a3e635;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #a3e635;
      --primary-hover: #bef264;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --danger-border: rgba(239, 68, 68, 0.15);
    }

    body {
      width: 340px;
      min-height: 200px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.01);
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #18181b;
      border: 1px solid var(--card-border);
      color: #fff;
    }
    
    .logo-star {
      width: 18px;
      height: 18px;
    }

    .header-text h1 { 
      font-size: 13px; 
      font-weight: 700; 
      color: var(--text); 
      letter-spacing: -0.015em;
    }
    
    .header-text p { 
      font-size: 11px; 
      color: var(--text-muted); 
      margin-top: 1px; 
    }

    .status-dot {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27272a;
      transition: background 0.3s;
    }
    .status-dot.connected { 
      background: #10b981; 
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    /* Content */
    .content { padding: 14px 16px; }

    /* Login form */
    .form-group {
      margin-bottom: 12px;
    }
    
    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .input-icon {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }
    
    .input-field {
      width: 100%;
      padding: 8px 10px 8px 32px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-field:focus { 
      border-color: var(--input-focus); 
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-primary { 
      background: var(--primary); 
      color: #030303; 
    }
    .btn-primary:hover:not(:disabled) { 
      background: var(--primary-hover); 
    }
    
    .btn-secondary {
      background: #ffffff;
      color: #030303;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #e4e4e7;
    }

    /* Session list */
    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .session-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .session-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .platform-icon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    
    .platform-icon {
      width: 18px;
      height: 18px;
    }
    
    .session-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .session-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    
    .session-status-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      font-size: 9px;
      font-weight: 700;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    
    .session-details {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    
    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .detail-row span:last-child {
      color: var(--text);
      font-weight: 500;
    }

    .no-sessions {
      text-align: center;
      padding: 24px 12px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .no-sessions strong { 
      display: block; 
      color: var(--text); 
      margin-bottom: 4px;
      font-size: 12px;
    }

    /* Error */
    .error-msg {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--danger);
      font-size: 11px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Current site */
    .current-site-banner {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .current-site-banner span {
      color: var(--text);
      font-weight: 600;
    }

    /* Footer */
    .footer {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.005);
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 220px;
    }
    
    .user-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .footer-email { 
      font-size: 11px; 
      color: var(--text-muted); 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
    }
    
    .logout-btn {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .logout-btn:hover { 
      color: var(--danger); 
    }

    .hidden { display: none !important; }
    .spinner { 
      display: inline-block; 
      animation: spin 0.8s linear infinite; 
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <svg class="logo-star" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2l2.3 4.8 5.1-1.6-1.6 5.1 4.8 2.3-4.8 2.3 1.6 5.1-5.1-1.6-2.3 4.8-2.3-4.8-5.1 1.6 1.6-5.1-4.8-2.3 4.8-2.3-1.6-5.1 5.1 1.6L12 2z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>WithUs Vault</h1>
      <p>Delegated Credential Access</p>
    </div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <!-- Login View -->
  <div id="login-view" class="content hidden">
    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="email" class="input-field" placeholder="you@company.com" autocomplete="email" />
      </div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="current-password" />
      </div>
    </div>
    <div class="error-msg hidden" id="login-error"></div>
    <button class="btn btn-primary" id="login-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
      Sign in to WithUs
    </button>
  </div>

  <!-- Sessions View -->
  <div id="sessions-view" class="content hidden">
    <div class="current-site-banner" id="current-site"></div>
    <h2 class="section-title">Active Delegated Sessions</h2>
    <div id="sessions-list"></div>
  </div>

  <!-- Footer (when logged in) -->
  <div class="footer hidden" id="footer">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">A</div>
      <span class="footer-email" id="user-email"></span>
    </div>
    <button class="logout-btn" id="logout-btn">Sign out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
