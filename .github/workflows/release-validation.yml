name: Release Validation

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  test-integration:
    name: Integration & Crypto Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sdap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Setup DB and Run Heavy Verification
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/sdap_test"
          VAULT_ENCRYPTION_KEY: "c3VwZXJzZWNyZXRrZXliYXNlNjRtdXN0YmUzMmJ5dGVz" # 32 bytes base64
        run: |
          npx prisma db push --schema=packages/db/prisma/schema.prisma
          npx ts-node apps/api/verification/crypto/verify-crypto.ts
          npm run test:e2e --workspace=api
